<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>BHARAT AI</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<div id="snake-scene" class="snake-scene" aria-hidden="true"><img src="assets/snake-king.svg" alt="" draggable="false"></div>
<header class="topbar">
  <div class="brandmark">भा</div><div class="brandtext"><strong>BHARAT AI</strong><button id="connection" class="connection" type="button" aria-live="polite">AI कनेक्शन जाँचें</button></div>
  <button id="reset" class="newchat" aria-label="नई चैट" title="नई चैट">＋</button>
</header>
<main id="chat" aria-live="polite">
  <section class="welcome" id="welcome">
    <div class="welcome-icon">भा</div>
    <h1>नमस्ते! मैं BHARAT AI हूँ।</h1>
    <p>परीक्षा, भर्ती, दाखिले, छात्रवृत्ति, सरकारी सेवाओं और फॉर्म के काम के लिए पूछें।</p>
    <div class="quick-prompts">
      <button data-q="राजस्थान में 12वीं पास के लिए सरकारी भर्तियाँ बताओ">सरकारी भर्तियाँ</button>
      <button data-q="मुझे सरकारी फॉर्म भरने में मदद चाहिए">फॉर्म भरने में मदद</button>
      <button data-q="सरकारी छात्रवृत्ति और योजनाओं की पात्रता बताओ">छात्रवृत्ति / योजनाएँ</button>
      <button data-q="इस सरकारी फॉर्म के लिए कौन-कौन से दस्तावेज चाहिए?">फॉर्म के दस्तावेज़</button>
    </div>
  </section>
</main>
<form id="form" class="composer">
  <textarea id="message" rows="1" maxlength="4000" placeholder="परीक्षा, भर्ती या फॉर्म से जुड़ा काम लिखें..." required aria-label="अपना संदेश लिखें"></textarea>
  <button id="send" type="submit" aria-label="भेजें">↑</button>
  <div class="disclaimer">BHARAT AI गलत जानकारी का अनुमान लगाने के बजाय आपसे पुष्टि माँगेगा।</div>
</form>
</div>
<script src="app.js"></script>
</body></html>
