<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>BHARAT AI</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brandmark">भा</div><div class="brandtext"><strong>BHARAT AI</strong><button id="connection" class="connection" type="button" aria-live="polite">AI कनेक्शन जाँचें</button></div>
  <button id="reset" class="newchat" aria-label="नई चैट" title="नई चैट">＋</button>
  <button id="menuToggle" class="menu-toggle" aria-label="अधिक विकल्प" aria-expanded="false" title="अधिक विकल्प">⋮</button>
</header>
<div id="moreMenu" class="more-menu" hidden>
  <button type="button" data-menu-action="new">＋ नई चैट</button>
  <button type="button" data-menu-action="save">▣ Draft सेव करें</button>
  <button type="button" data-menu-action="drafts">▤ Drafts खोलें</button>
  <button type="button" data-menu-action="settings">⚙ Settings</button>
  <button type="button" data-menu-action="help">ⓘ Help और Privacy</button>
</div>
<section id="utilityPanel" class="utility-panel" hidden aria-live="polite">
  <div class="utility-head"><strong id="utilityTitle">BHARAT AI</strong><button id="utilityClose" type="button" aria-label="बंद करें">×</button></div>
  <div id="utilityContent" class="utility-content"></div>
</section>
<main id="chat" aria-live="polite">
  <section class="welcome" id="welcome">
    <div class="welcome-icon">भा</div>
    <h1 id="welcomeTitle">नमस्ते! मैं BHARAT AI हूँ।</h1>
    <p id="welcomeDescription">पढ़ाई, टेक्नोलॉजी, देश-दुनिया और रोज़मर्रा के सवालों के लिए आपका AI सहायक।</p>
    <div class="quick-prompts">
      <button id="quickPrompt1" data-q="मुझे AI सीखना शुरू करना है">AI सीखें</button>
      <button id="quickPrompt2" data-q="मुझे पढ़ाई में मदद चाहिए">पढ़ाई</button>
      <button id="quickPrompt3" data-q="भारत के बारे में बताओ">भारत की जानकारी</button>
    </div>
  </section>

</main>
<form id="form" class="composer">
  <textarea id="message" rows="1" maxlength="4000" placeholder="यहाँ अपना सवाल लिखें..." required aria-label="अपना संदेश लिखें"></textarea>
  <button id="send" type="submit" aria-label="भेजें">↑</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="app.js"></script>
</body></html>
