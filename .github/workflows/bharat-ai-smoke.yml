name: BHARAT AI live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/index.js"
      - "app.js"
      - "styles.css"
      - ".github/workflows/bharat-ai-smoke.yml"

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: node --check worker/index.js

      - name: Check Gemini connection
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 "https://bharat-ai-api.gyarasigujjar57.workers.dev/health?test=1")"
          echo "$result"
          echo "$result" | grep -q '"aiReady":true'

      - name: Check the JSON endpoint used by the Android app
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"भारत में पानी का चक्र आसान हिंदी में समझाओ।","history":[],"language":"hi"}')"
          echo "$result"
          echo "$result" | grep -q '"reply"'
          echo "$result" | grep -q 'वाष्पीकरण\|बादल\|बारिश'

      - name: Check real streaming response
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --no-buffer --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"Explain 2 + 2 in one short sentence.","history":[],"language":"en"}')"
          echo "$result"
          echo "$result" | grep -q '"reply"'

      - name: Check general assistant is not scope-locked
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --no-buffer --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"Explain what a black hole is in simple Hindi.","history":[],"language":"hi"}')"
          echo "$result"
          ! echo "$result" | grep -q 'मैं यह काम नहीं कर सकता'
          echo "$result" | grep -q '"reply"'

      - name: Check no-billing live web search returns source links
        run: |
          set -euo pipefail
          result="$(curl --silent --show-error --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"Google पर खोजकर आज की भारत की ताज़ा प्रमुख खबरें बताओ और स्रोत लिंक दो।","history":[]}')"
          echo "$result"
          echo "$result" | grep -qi 'https\?://'

      - name: Check public web search diagnostics
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 "https://bharat-ai-api.gyarasigujjar57.workers.dev/health?searchtest=1")"
          echo "$result"
          echo "$result" | grep -q '"searchProvider"'
          echo "$result" | grep -Eq '"resultCount":[1-9]'

      - name: Check independent no-billing live web search for recruitment
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"Rajasthan mein 12vi pass ke liye abhi kaun si sarkari bharti open hai?","history":[]}')"
          echo "$result"
          echo "$result" | grep -qi 'https\?://'
          ! echo "$result" | grep -q 'मैं यह काम नहीं कर सकता'
          ! echo "$result" | grep -q '"liveSearchUnavailable":true'

      - name: Check live India clock answer
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --no-buffer --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"भारत में अभी वर्तमान समय क्या है?","history":[],"language":"hi"}')"
          echo "$result"
          echo "$result" | grep -q 'भारत में अभी'
