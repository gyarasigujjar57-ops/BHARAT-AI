name: BHARAT AI live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/index.js"
      - "app.js"
      - "styles.css"
      - ".github/workflows/bharat-ai-smoke.yml"

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Gemini connection
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 "https://bharat-ai-api.gyarasigujjar57.workers.dev/health?test=1")"
          echo "$result"
          echo "$result" | grep -q '"aiReady":true'

      - name: Check real streaming response
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --no-buffer --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat/stream" \
            --data '{"message":"Explain 2 + 2 in one short sentence.","history":[],"language":"en"}')"
          echo "$result"
          echo "$result" | grep -q '"text"'
          echo "$result" | grep -q '\[DONE\]'

      - name: Inspect search provider response
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 -A "Mozilla/5.0" -w "\\nHTTP_STATUS:%{http_code}\\n" "https://html.duckduckgo.com/html/?q=Rajasthan+12th+pass+government+job+latest+notification" -o /tmp/ddg.html
          echo "result links: $(grep -o 'result__a' /tmp/ddg.html | wc -l)"
          grep -Eo 'result__a|anomaly|captcha|challenge' /tmp/ddg.html | head -20 || true

      - name: Check Bing RSS search endpoint
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 -A "Mozilla/5.0" -w "\\nHTTP_STATUS:%{http_code}\\n" "https://www.bing.com/search?format=rss&q=Rajasthan+12th+pass+government+job+latest+notification" -o /tmp/bing.xml
          echo "RSS items: $(grep -o '<item>' /tmp/bing.xml | wc -l)"
          head -c 500 /tmp/bing.xml

      - name: Check Worker live search results
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 20 "https://bharat-ai-api.gyarasigujjar57.workers.dev/health?searchtest=1")"
          echo "$result"
          echo "$result" | grep -q '"resultCount":[1-9]'

      - name: Check independent live web search for recruitment
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat" \
            --data '{"message":"Rajasthan mein 12vi pass ke liye abhi kaun si sarkari bharti open hai?","history":[]}')"
          echo "$result"
          echo "$result" | grep -qi 'https\?://'
          ! echo "$result" | grep -q 'मैं यह काम नहीं कर सकता'
          ! echo "$result" | grep -q '"liveSearchUnavailable":true'

      - name: Check live India clock answer
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --no-buffer --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST "https://bharat-ai-api.gyarasigujjar57.workers.dev/api/chat/stream" \
            --data '{"message":"भारत में अभी वर्तमान समय क्या है?","history":[],"language":"hi"}')"
          echo "$result"
          echo "$result" | grep -q 'भारत में अभी'
          echo "$result" | grep -q '\[DONE\]'
